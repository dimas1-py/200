[<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10">
    
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md relative overflow-hidden">
        
        <!-- Header Logo -->
        <div class="flex items-center justify-center gap-2 mb-6">
            <i class="fas fa-store text-green-600 text-3xl"></i>
            <span class="text-2xl font-bold text-green-600">MyToko</span>
        </div>

        <!-- ==================== BAGIAN LOGIN ==================== -->
        <div id="loginSection" class="transition-all duration-300 block">
            <h2 class="text-xl font-bold text-center mb-6 text-black">Masuk ke Akun</h2>
            <form id="loginForm" class="space-y-4">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-black mb-1">Email</label>
                    <input type="email" id="loginEmail" placeholder="Masukkan email" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-black mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan password" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Ingat Saya & Lupa Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-green-600 rounded focus:ring-2 focus:ring-green-600">
                        <span class="text-sm text-black font-medium">Ingat saya</span>
                    </label>
                    <a href="#" class="text-sm text-green-600 font-semibold hover:underline">Lupa password?</a>
                </div>

                <!-- Error Message -->
                <p id="errorMessage" class="text-red-500 text-sm font-medium hidden">Email atau password salah.</p>

                <!-- Tombol Masuk -->
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition duration-200">Masuk</button>
            </form>

            <!-- Link Register -->
            <p class="text-center text-sm text-black mt-6">
                Belum memiliki akun? <a href="register.html" class="text-green-600 font-semibold hover:underline">Daftar sekarang</a>
            </p>
        </div>


    </div>

    <!-- Script Logika Interface & Autentikasi -->
    <script>
        // Database Static Sementara + Load dari localStorage
        let users = [
            {
                id: 1,
                name: "Admin Utama",
                email: "adminmytoko@gmail.com",
                password: "admin123",
                role: "admin"
            }
        ];

        // Load registered users dari localStorage
        const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers'));
        if (registeredUsers) {
            users = users.concat(registeredUsers);
        }

        // Logika Form Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('errorMessage');
            
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                errorMsg.classList.add('hidden');
                localStorage.setItem("loginUser", JSON.stringify(user));
                window.location.href = "indexadmin.html"; 
            } else {
                errorMsg.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
