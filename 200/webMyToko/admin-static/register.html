<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10">
    <main class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-6">
            <i class="fas fa-store text-green-600 text-3xl"></i>
            <span class="text-2xl font-bold text-green-600">MyToko</span>
        </div>

        <section id="registerSection">
            <h1 class="text-xl font-bold text-center mb-6 text-black">Daftar Akun Baru</h1>
            <form id="registerForm" class="space-y-4">
                <!-- Nama Lengkap -->
                <div>
                    <label for="registerName" class="block text-sm font-medium text-black mb-1">Nama Lengkap</label>
                    <input type="text" id="registerName" name="name" autocomplete="name" placeholder="Masukkan nama lengkap" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Email -->
                <div>
                    <label for="registerEmail" class="block text-sm font-medium text-black mb-1">Email</label>
                    <input type="email" id="registerEmail" name="email" autocomplete="email" placeholder="Masukkan email" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Password -->
                <div>
                    <label for="registerPassword" class="block text-sm font-medium text-black mb-1">Password</label>
                    <input type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="Buat password" minlength="6" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Konfirmasi Password -->
                <div>
                    <label for="registerConfirmPassword" class="block text-sm font-medium text-black mb-1">Konfirmasi Password</label>
                    <input type="password" id="registerConfirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Ulangi password" minlength="6" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <!-- Error Message -->
                <p id="errorMessage" class="text-red-500 text-sm font-medium hidden"></p>

                <!-- Persetujuan Syarat -->
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required class="w-4 h-4 text-green-600 rounded mt-1 focus:ring-2 focus:ring-green-600">
                    <span class="text-sm text-black">
                        Saya setuju dengan <a href="#" class="text-green-600 font-semibold hover:underline">syarat dan ketentuan</a> yang berlaku
                    </span>
                </label>

                <!-- Tombol Daftar -->
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl mt-6 transition duration-200">Daftar</button>
            </form>

            <!-- Link Login -->
            <p class="text-center text-sm text-black mt-6">
                Sudah punya akun? <a href="login.html" class="text-green-600 font-semibold hover:underline">Masuk di sini</a>
            </p>
        </section>
    </main>

    <script>
        // Load existing users dari localStorage atau gunakan default
        let users = JSON.parse(localStorage.getItem('registeredUsers')) || [
            {
                id: 1,
                name: "Admin Utama",
                email: "adminmytoko@gmail.com",
                password: "admin123",
                role: "admin"
            }
        ];

        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const errorMsg = document.getElementById('errorMessage');
            
            // Validasi Password
            if (password !== confirmPassword) {
                errorMsg.textContent = 'Password tidak sesuai. Silakan coba lagi.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            // Validasi Persetujuan Syarat
            if (!agreeTerms) {
                errorMsg.textContent = 'Anda harus menyetujui syarat dan ketentuan untuk mendaftar.';
                errorMsg.classList.remove('hidden');
                return;
            }

            // Validasi email sudah terdaftar
            const emailExists = users.find(u => u.email === email);
            if (emailExists) {
                errorMsg.textContent = 'Email sudah terdaftar. Silakan gunakan email lain.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            // Tambah user baru ke database
            const newUser = {
                id: users.length + 1,
                name: name,
                email: email,
                password: password,
                role: "user"
            };
            
            users.push(newUser);
            localStorage.setItem('registeredUsers', JSON.stringify(users));
            
            errorMsg.classList.add('hidden');
            alert('Pendaftaran berhasil! Email ' + email + ' sudah terdaftar. Silakan masuk dengan akun Anda.');
            this.reset();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
