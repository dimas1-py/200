<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentikasi - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10">
    
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md relative overflow-hidden">
        
        <!-- Header Logo -->
        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="text-2xl font-bold text-gray-900">
               <span class="text-green-600">MyToko</span>
            </span>
        </div>

        <!-- ==================== BAGIAN LOGIN ==================== -->
        <div id="loginSection" class="transition-all duration-300 block">
            <h2 class="text-xl font-bold text-center mb-5 text-gray-800">Masuk ke Akun</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="loginEmail" placeholder="Masukkan email" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan password" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <p id="errorMessage" class="text-red-500 text-sm font-medium hidden">Email atau password salah.</p>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition">Masuk</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">
                Belum memiliki akun? <a href="register.html" class="text-green-600 font-semibold hover:underline">Daftar sekarang</a>
            </p>
        </div>


    </div>

    <!-- Script Logika Interface & Autentikasi -->
    <script>
        // Database Static Sementara
        const users = [
            {
                id: 1,
                name: "Admin Utama",
                email: "adminmytoko@gmail.com",
                password: "admin123",
                role: "admin"
            }
        ];

        // Logika Form Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('errorMessage');
            
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                errorMsg.classList.add('hidden');
                localStorage.setItem("loginUser", JSON.stringify(user));
                window.location.href = "indexadmin.html"; 
            } else {
                errorMsg.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
