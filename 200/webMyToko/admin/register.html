<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10">
    <main class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="flex items-center justify-center gap-2 mb-6">

            <span class="text-2xl font-bold text-green-600">MyToko</span>
        </div>

        <section id="registerSection">
            <h1 class="text-xl font-bold text-center mb-5 text-gray-800">Buat Akun Baru</h1>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label for="registerName" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="registerName" name="name" autocomplete="name" placeholder="Masukkan nama lengkap" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label for="registerEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="registerEmail" name="email" autocomplete="email" placeholder="Masukkan email" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label for="registerPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="Buat password" minlength="6" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl mt-4 transition">Daftar</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">
                Sudah punya akun? <a href="login.html" class="text-green-600 font-semibold hover:underline">Masuk di sini</a>
            </p>
        </section>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();
            alert('Simulasi pendaftaran berhasil! Silakan masuk dengan akun yang sudah ada.');
            this.reset();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
