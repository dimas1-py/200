<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Pelanggan - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <main class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-green-600">MyToko</h1>
        <p class="text-gray-500 mt-2">Login Pelanggan</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input id="email" type="email" placeholder="Masukkan email" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input id="password" type="password" placeholder="Masukkan password" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <p id="errorMessage" class="hidden text-red-600 text-sm">Email atau password salah.</p>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">Masuk</button>
      </form>
      <p class="text-center text-sm text-gray-600 mt-6">Belum punya akun? <a href="register.html" class="text-green-600 font-semibold hover:underline">Daftar</a></p>
    </main>
    <script>
      const akun = {
        id: 1,
        name: 'Pelanggan MyToko',
        email: 'pelanggan@gmail.com',
        password: 'pelanggan123',
        role: 'pelanggan'
      };

      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');

        if (email !== akun.email || password !== akun.password) {
          errorMessage.classList.remove('hidden');
          return;
        }

        localStorage.setItem('loginUser', JSON.stringify(akun));
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>
