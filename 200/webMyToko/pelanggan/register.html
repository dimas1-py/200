<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Pelanggan - MyToko</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <main class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-green-600">MyToko</h1>
        <p class="text-gray-500 mt-2">Register Pelanggan</p>
      </div>
      <form id="registerForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input id="email" type="email" placeholder="nama@email.com" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input id="password" type="password" placeholder="Buat password" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <p id="message" class="hidden text-red-600 text-sm">Pendaftaran akun belum tersedia.</p>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">Daftar</button>
      </form>
      <p class="text-center text-sm text-gray-600 mt-6"><a href="login.html" class="text-green-600 font-semibold hover:underline">Kembali ke login</a></p>
    </main>
    <script>
      document.getElementById('registerForm').addEventListener('submit', function(event) {
        event.preventDefault();
        document.getElementById('message').classList.remove('hidden');
      });
    </script>
  </body>
</html>
